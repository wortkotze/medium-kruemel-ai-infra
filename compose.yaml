# ──────────────────────────────────────────────
# LiteLLM Proxy & Langfuse Stack (Podman / Docker)
# ──────────────────────────────────────────────
# Start:  podman compose up -d (or make start)
# Stop:   podman compose down
# Logs:   podman compose logs -f

name: litellm_local

networks:
  litellm-net:
    driver: bridge

services:

  # ─── PostgreSQL Backend (LiteLLM & Langfuse DBs)
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=16MB", "-c", "effective_cache_size=256MB"]
    networks:
      - litellm-net

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

    volumes:
      - litellm-pgdata:/var/lib/postgresql/data
      - ./scripts/init/init-langfuse-db.sql:/docker-entrypoint-initdb.d/01-init-langfuse.sql:ro,z
      - ./scripts/init/init-hub-db.sql:/docker-entrypoint-initdb.d/02-init-hub.sql:ro,z

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Redis Cache & Worker Queues ─────────────
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: litellm-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - litellm-net
    volumes:
      - litellm-redisdata:/data
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Qdrant Vector Search Engine (RAG & Memory)
  qdrant:
    image: docker.io/qdrant/qdrant:latest
    container_name: litellm-qdrant
    restart: unless-stopped
    networks:
      - litellm-net
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - litellm-qdrantdata:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_STATIC_CONTENT: "true"
      QDRANT__LOG_LEVEL: "INFO"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Memgraph Knowledge Graph Engine ─────────
  memgraph:
    image: docker.io/memgraph/memgraph:latest
    container_name: litellm-memgraph
    restart: unless-stopped
    networks:
      - litellm-net
    ports:
      - "127.0.0.1:7687:7687"
    volumes:
      - litellm-memgraph-data:/var/lib/memgraph
    command: ["--log-level=WARNING"]
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/7687' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Memgraph Lab (Interactive Graph Studio) ─
  memgraph-lab:
    image: docker.io/memgraph/lab:latest
    container_name: litellm-memgraph-lab
    restart: unless-stopped
    networks:
      - litellm-net
    depends_on:
      memgraph:
        condition: service_healthy
    ports:
      - "${MEMGRAPH_LAB_PORT:-1515}:3000"
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ─── Langfuse ClickHouse (Analytics OLAP) ────
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:24.3-alpine
    container_name: langfuse-clickhouse
    restart: unless-stopped
    user: "101:101"
    networks:
      - litellm-net
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      MAX_SERVER_MEMORY_USAGE_TO_RAM_RATIO: "0.5"
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Langfuse MinIO (S3 Blob Storage) ────────
  minio:
    image: cgr.dev/chainguard/minio
    container_name: langfuse-minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    networks:
      - litellm-net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      GOMEMLIMIT: 256MiB
    ports:
      - "127.0.0.1:9090:9000"
      - "127.0.0.1:9091:9001"
    volumes:
      - langfuse-minio-data:/data
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Langfuse Worker (Async Event Ingestion) ─
  langfuse-worker:
    image: ghcr.io/langfuse/langfuse-worker:3
    container_name: langfuse-worker
    restart: unless-stopped
    networks:
      - litellm-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 384M
    environment: &langfuse-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD}@db:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?LANGFUSE_NEXTAUTH_SECRET must be set}
      SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT must be set}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?LANGFUSE_ENCRYPTION_KEY must be set}
      TELEMETRY_ENABLED: "false"
      NODE_OPTIONS: "--max-old-space-size=768"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLICKHOUSE_MIGRATION_URL: clickhouse://${CLICKHOUSE_USER:-clickhouse}:${CLICKHOUSE_PASSWORD}@clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

  # ─── Langfuse Web UI & API ───────────────────
  langfuse-web:
    image: ghcr.io/langfuse/langfuse:3
    container_name: langfuse-web
    restart: unless-stopped
    networks:
      - litellm-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    environment:
      <<: *langfuse-env
      NODE_OPTIONS: "--max-old-space-size=1536"
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000

  # ─── n8n Workflow Automation Engine ──────────
  n8n:
    image: docker.io/n8nio/n8n:latest
    container_name: litellm-n8n
    restart: unless-stopped
    networks:
      - litellm-net
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-litellm}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Berlin
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - NODE_OPTIONS=--max-old-space-size=512
    volumes:
      - litellm-n8ndata:/home/node/.n8n
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  # ─── Krümel AI Central Hub & Status Dashboard ──
  hub:
    image: docker.io/library/python:3.11-alpine
    container_name: kruemel-hub
    restart: unless-stopped
    networks:
      - litellm-net
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "1512:1512"
    volumes:
      - ./hub:/app:ro,z
    working_dir: /app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-litellm}
      - HUB_PORT=1512
    command: ["sh", "-c", "pip install --quiet --no-cache-dir psycopg2-binary && python3 -u server.py"]
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  # ─── Krümel AI Central Agent Registry & Gateway ──
  agent-gateway:
    image: docker.io/library/python:3.11-alpine
    container_name: litellm-agent-gateway
    restart: unless-stopped
    networks:
      - litellm-net
    depends_on:
      - litellm
    ports:
      - "1518:1518"
    volumes:
      - ./gateway:/app:ro,z
      - ./config:/config:ro,z
    working_dir: /app
    environment:
      - GATEWAY_PORT=1518
      - LITELLM_URL=http://litellm-proxy:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    command: ["sh", "-c", "pip install --quiet --no-cache-dir -r requirements.txt && python3 -u server.py"]
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:1518/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── LiteLLM Gateway ─────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: unless-stopped
    networks:
      - litellm-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      langfuse-web:
        condition: service_started

    ports:
      - "${PORT:-4000}:4000"

    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

    volumes:
      # Mount modular config directory
      - ./config:/app/config:ro,z
      # Fallback root config link
      - ./config/config.yaml:/app/config.yaml:ro,z
      # Mount FastMCP scripts
      - ./scripts:/app/scripts:ro,z
      # Sandboxed workspace for Filesystem MCP
      - ./workspace:/workspace:rw,z
      # Docker socket for docker_mcp
      - /var/run/docker.sock:/var/run/docker.sock

    env_file:
      - .env

    environment:
      - LITELLM_CONFIG_FILE_PATH=/app/config/config.yaml
      - DATABASE_URL=postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-litellm}
      - REDIS_URL=redis://redis:6379
      - LITELLM_LOG=${LITELLM_LOG:-INFO}
      - PORT=4000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse-web:3000}

    # Allow container to communicate with Ollama on the host
    extra_hosts:
      - "host.containers.internal:host-gateway"

    command:
      - "--config"
      - "/app/config/config.yaml"
      - "--port"
      - "4000"

  # ─── Open WebUI (Human-to-AI Chat Workspace) ─
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: litellm-open-webui
    restart: unless-stopped
    ports:
      - "1513:8080"
    environment:
      - OPENAI_API_BASE_URLS=http://litellm-proxy:4000/v1;http://agent-gateway:1518/v1
      - OPENAI_API_KEYS=${OPEN_WEBUI_API_KEY:-${LITELLM_MASTER_KEY}};sk-kruemel-agent-gateway
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=true
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-6a1e2d05fc5318151ce6b59b01bf59a792be6785040f4bb25d05cec23a04bcda}
      - WEBUI_NAME=Krümel AI Chat
      - ENABLE_OLLAMA_API=false
      - DEFAULT_MODELS=local-general
      - ENABLE_AUTOMATIONS=false
      - ENABLE_CALENDAR=false
      - ENABLE_NOTES=false
      - ENABLE_SUBAGENTS=false
    volumes:
      - litellm-open-webui-data:/app/backend/data
    networks:
      - litellm-net
    depends_on:
      - litellm
      - agent-gateway
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # ─── Headless Browser Automation (Agent Web Tool) ─
  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: litellm-browserless
    restart: unless-stopped
    ports:
      - "${BROWSERLESS_PORT:-1516}:3000"
    environment:
      - TIMEOUT=60000
      - CONCURRENT=5
      - QUEUED=10
      - WORKSPACE_DELETE_EXPIRED=true
      - CHROME_REFRESH_TIME=3600000
    networks:
      - litellm-net
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/pressure || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Isolated Code Execution Sandbox ────────
  sandbox:
    image: docker.io/library/python:3.11-alpine
    container_name: litellm-sandbox
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /app
    command: ["python", "-u", "server.py"]
    volumes:
      - ./sandbox:/app:ro
    ports:
      - "127.0.0.1:${SANDBOX_PORT:-1517}:8088"
    networks:
      - litellm-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8088/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── SearXNG (Privacy Meta-Search Engine) ────
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: litellm-searxng
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-1514}:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:1514/
    networks:
      - litellm-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  litellm-pgdata:
  litellm-redisdata:
  litellm-qdrantdata:
  litellm-n8ndata:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
  litellm-open-webui-data:
  litellm-memgraph-data:
