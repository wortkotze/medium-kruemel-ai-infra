<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="cookieGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f8c97c"/>
      <stop offset="55%" stop-color="#d98f36"/>
      <stop offset="100%" stop-color="#a35f1b"/>
    </radialGradient>
    <radialGradient id="chipGrad1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#542e12"/>
      <stop offset="100%" stop-color="#241004"/>
    </radialGradient>
    <radialGradient id="chipGrad2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#44220b"/>
      <stop offset="100%" stop-color="#1c0b02"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Cookie Base with soft shadow -->
  <path d="M50 7 C75 7 93 25 93 50 C93 75 75 93 50 93 C25 93 7 75 7 50 C7 25 25 7 50 7 Z" fill="url(#cookieGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle cookie rim highlight and texture -->
  <ellipse cx="46" cy="46" rx="38" ry="38" fill="none" stroke="#fed898" stroke-width="1.5" opacity="0.35"/>

  <!-- Chocolate Chips with realistic shapes & specular highlights -->
  <!-- Chip 1 (Top Left) -->
  <path d="M30 26 C28 21 35 17 41 20 C46 23 44 30 38 31 C32 32 31 29 30 26 Z" fill="url(#chipGrad1)"/>
  <circle cx="34" cy="23" r="1.5" fill="#7d451e" opacity="0.8"/>

  <!-- Chip 2 (Top Right) -->
  <path d="M63 28 C61 22 68 18 74 22 C79 26 76 34 70 34 C64 34 64 31 63 28 Z" fill="url(#chipGrad2)"/>
  <circle cx="67" cy="25" r="1.5" fill="#7d451e" opacity="0.8"/>

  <!-- Chip 3 (Center) -->
  <path d="M46 46 C41 40 48 33 55 37 C61 40 59 49 53 50 C47 51 48 49 46 46 Z" fill="url(#chipGrad1)"/>
  <circle cx="50" cy="41" r="1.8" fill="#7d451e" opacity="0.8"/>

  <!-- Chip 4 (Mid Left) -->
  <path d="M25 53 C21 48 26 41 32 44 C37 46 36 54 31 56 C26 57 27 55 25 53 Z" fill="url(#chipGrad2)"/>
  <circle cx="28" cy="48" r="1.5" fill="#7d451e" opacity="0.8"/>

  <!-- Chip 5 (Mid Right) -->
  <path d="M65 57 C61 52 66 45 73 48 C78 50 78 59 72 61 C66 62 67 59 65 57 Z" fill="url(#chipGrad1)"/>
  <circle cx="69" cy="53" r="1.5" fill="#7d451e" opacity="0.8"/>

  <!-- Chip 6 (Bottom Center) -->
  <path d="M42 71 C38 66 44 59 50 62 C55 64 54 72 48 74 C43 75 44 73 42 71 Z" fill="url(#chipGrad2)"/>
  <circle cx="46" cy="67" r="1.5" fill="#7d451e" opacity="0.8"/>

  <!-- Tiny delicious cookie crumbles & chips -->
  <circle cx="21" cy="35" r="2.2" fill="url(#chipGrad2)"/>
  <circle cx="59" cy="75" r="2.4" fill="url(#chipGrad1)"/>
  <circle cx="77" cy="41" r="2" fill="url(#chipGrad2)"/>
  <circle cx="36" cy="40" r="1.8" fill="url(#chipGrad1)"/>
  <circle cx="57" cy="22" r="1.6" fill="url(#chipGrad2)"/>
  <circle cx="34" cy="65" r="1.6" fill="url(#chipGrad1)"/>
</svg>
