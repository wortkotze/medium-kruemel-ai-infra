<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krümel AI | Chat Suite</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg-body);
    }

    .chat-frame-container {
      flex: 1;
      width: 100%;
      position: relative;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
    }

    .chat-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .chat-loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-body);
      color: var(--text-secondary);
      gap: 1rem;
      z-index: 1;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .chat-loading-overlay.hidden {
      opacity: 0;
    }

    .chat-spinner {
      width: 38px;
      height: 38px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    (function() {
      var l = localStorage.getItem("kruemel_lang") || "de";
      document.documentElement.setAttribute("lang", l);
      var t = localStorage.getItem("kruemel_theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div id="global-tooltip"></div>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container navbar-inner" style="max-width: 100%; padding: 0 1.5rem;">
      <a href="/" class="brand-link">
        <span class="brand-logo">🍪</span>
        <span class="brand-title">Krümel AI</span>
      </a>

      <ul class="nav-links">
        <li><a href="/" class="nav-link" data-i18n="nav_overview">Übersicht</a></li>
        <li><a href="/chat" class="nav-link active" data-i18n="nav_chat">💬 Chat</a></li>
        <li><a href="/agents" class="nav-link" data-i18n="nav_agents">🤖 Agenten</a></li>
        <li><a href="/status" class="nav-link" data-i18n="nav_status">Status & Uptime</a></li>
        <li><a href="/docs" class="nav-link" data-i18n="nav_docs">Architektur & Doku</a></li>
      </ul>

      <div class="nav-actions">
        <a id="btn-fullscreen-chat" href="http://localhost:1513" target="_blank" class="ctrl-btn" title="In neuem Tab / Vollbild öffnen" style="text-decoration: none;" data-i18n="btn_fullscreen_chat">
          ↗ Vollbild
        </a>
        <a href="/status" id="header-health-pill" class="health-indicator-btn">
          <div class="pulse-dot"></div>
          <span id="header-health-text" data-i18n="pill_checking">Prüfe Infrastruktur...</span>
        </a>
        <button id="btn-theme" class="ctrl-btn" onclick="toggleTheme()" data-i18n="btn_theme_light">☀️ Hell</button>
        <button id="btn-lang" class="ctrl-btn" onclick="toggleLanguage()">🇬🇧 EN</button>
      </div>
    </div>
  </nav>

  <!-- Embedded Iframe Chat Workspace -->
  <div class="chat-frame-container">
    <div id="chat-loading" class="chat-loading-overlay">
      <div class="chat-spinner"></div>
      <div style="font-size: 0.95rem; font-weight: 500;" data-i18n="chat_connecting">Verbinde mit Krümel AI Chat (:1513)...</div>
      <div style="font-size: 0.8rem; color: var(--text-muted);" data-i18n="chat_connecting_sub">LiteLLM Proxy & Ollama Backend bereit</div>
    </div>
    <iframe id="chat-frame" class="chat-iframe" src="" onload="hideLoading()"></iframe>
  </div>

  <script src="/app.js"></script>
  <script>
    // Dynamically connect to the active host (handles localhost, LAN IP, VPN, custom domain)
    (function initChatFrame() {
      const host = window.location.hostname || 'localhost';
      const chatUrl = 'http://' + host + ':1513';
      const frame = document.getElementById('chat-frame');
      if (frame) frame.src = chatUrl;
      const fsBtn = document.getElementById('btn-fullscreen-chat');
      if (fsBtn) fsBtn.href = chatUrl;
    })();

    function hideLoading() {
      const overlay = document.getElementById('chat-loading');
      if (overlay) overlay.classList.add('hidden');
    }
    // Timeout fallback in case onload fires late or iframe is blocked
    setTimeout(hideLoading, 3000);
  </script>
</body>
</html>
