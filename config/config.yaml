router_settings:
  routing_strategy: usage-based-routing
  set_verbose: false
  num_retries: 2
  timeout: 90
  allowed_fails: 2
  cooldown_time: 60
  fallbacks:
  - smart-coder:
    - local-coder-fast
  - smart-general:
    - local-general-fast
  - local-coder:
    - local-coder-fast
  - local-general:
    - local-general-fast
mcp_servers:
  litellm_mcp:
    name: LiteLLM Gateway Management MCP
    description: Manage models, inspect gateway health, query router analytics, and
      create virtual API keys.
    transport: stdio
    command: python3
    args:
    - "/app/scripts/mcp/litellm_mcp.py"
    environment:
      LITELLM_API_BASE: http://localhost:4000
      LITELLM_MASTER_KEY: os.environ/LITELLM_MASTER_KEY
    timeout: 30
    allowed_tools:
    - list_gateway_models
    - get_gateway_health
    - test_gateway_completion
    - generate_api_key
  cloudflare_mcp:
    name: Cloudflare Infrastructure MCP
    description: Manage DNS, Cloudflare Tunnels, Zero Trust access policies, and Edge
      Workers.
    transport: stdio
    command: python3
    args:
    - "/app/scripts/mcp/cloudflare_mcp.py"
    environment:
      CLOUDFLARE_API_TOKEN: os.environ/CLOUDFLARE_API_TOKEN
      CLOUDFLARE_EMAIL: os.environ/CLOUDFLARE_EMAIL
      CLOUDFLARE_ACCOUNT_ID: os.environ/CLOUDFLARE_ACCOUNT_ID
    timeout: 30
    allowed_tools:
    - verify_token
    - list_zones
    - list_dns_records
    - get_dns_record
    - create_dns_record
    - update_dns_record
    - list_tunnels
    - get_tunnel_status
    - list_workers
    disallowed_tools:
    - delete_zone
    - delete_tunnel
  github_mcp:
    name: GitHub Developer MCP
    description: Safe repository inspection, code reading, PR review, and issue search.
    transport: sse
    url: https://mcp.github.com/sse
    headers:
      Authorization: Bearer os.environ/GITHUB_READONLY_TOKEN
      Accept: application/vnd.github.v3+json
      User-Agent: LiteLLM-A2A-Gateway
    timeout: 45
    allowed_tools:
    - search_repositories
    - get_file_contents
    - list_commits
    - get_issue
    - list_issues
    - list_pull_requests
    - get_pull_request
    - list_branches
    disallowed_tools:
    - create_issue
    - create_pull_request
    - delete_repository
    - delete_branch
    - force_push
  github_devops_mcp:
    name: GitHub DevOps & Automation MCP
    description: Automated PR creation, issue triaging, and workflow dispatch.
    transport: sse
    url: https://mcp.github.com/sse
    headers:
      Authorization: Bearer os.environ/GITHUB_DEVOPS_TOKEN
      Accept: application/vnd.github.v3+json
      User-Agent: LiteLLM-A2A-Gateway
    timeout: 60
    allowed_tools:
    - create_issue
    - create_pull_request
    - update_pull_request
    - create_issue_comment
    disallowed_tools:
    - delete_repository
    - delete_branch
    - force_push
  github_user_passthrough_mcp:
    name: GitHub User Passthrough MCP
    description: Forwards individual caller OAuth/PAT tokens per-request.
    transport: sse
    url: https://mcp.github.com/sse
    forward_headers:
    - Authorization
    - X-GitHub-Token
    timeout: 45
  brave_search_mcp:
    name: Brave Search MCP
    description: Privacy-focused web search, news aggregation, and local entity retrieval.
    transport: http
    url: https://api.search.brave.com/res/v1/mcp
    headers:
      X-Subscription-Token: os.environ/BRAVE_API_KEY
      Accept: application/json
    timeout: 30
    allowed_tools:
    - web_search
    - news_search
    - summarize_url
  google_search_mcp:
    name: Google Serper MCP
    description: Google Search index querying, knowledge graph queries, and web scraping.
    transport: http
    url: https://google.serper.dev/mcp
    headers:
      X-API-KEY: os.environ/SERPER_API_KEY
      Content-Type: application/json
    timeout: 30
    allowed_tools:
    - google_search
    - scrape_webpage
    - google_search_scholar
  google_workspace_mcp:
    name: Google Workspace & Drive MCP
    description: Read, search, and manage Google Drive files, Google Docs, and Spreadsheets.
    transport: http
    url: https://workspace-mcp.googleapis.com/v1
    headers:
      Authorization: Bearer os.environ/GOOGLE_WORKSPACE_ACCESS_TOKEN
      X-Goog-User-Project: os.environ/GOOGLE_PROJECT_ID
    timeout: 60
    allowed_tools:
    - search_drive
    - read_doc
    - read_sheet
    - list_folder_contents
    - create_doc
    - append_to_sheet
    disallowed_tools:
    - delete_file_permanently
    - empty_trash
    - change_file_ownership
  filesystem_mcp:
    name: Sandboxed Local Filesystem MCP
    description: Safe file reading, writing, diffing, and searching inside the designated
      workspace.
    transport: stdio
    command: python3
    args:
    - "/app/scripts/mcp/filesystem_mcp.py"
