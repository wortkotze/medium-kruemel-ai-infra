    timeout: 30
    allowed_tools:
    - search_web
    - search_news
    - search_scholar
  browserless_mcp:
    name: Browserless Headless Chromium MCP
    description: Navigate dynamic web pages, extract DOM and rendered text, capture
      visual screenshots.
    transport: stdio
    command: python3
    args:
    - "/app/scripts/mcp/browserless_mcp.py"
    environment:
      BROWSERLESS_URL: http://browserless:3000
    timeout: 45
    allowed_tools:
    - get_web_content
    - scrape_text
    - take_screenshot
  sandbox_mcp:
    name: Isolated Code Execution Sandbox MCP
    description: Execute ephemeral Python and Shell code in a secure, non-root, resource-limited
      container.
    transport: stdio
    command: python3
    args:
    - "/app/scripts/mcp/sandbox_mcp.py"
    environment:
      SANDBOX_URL: http://sandbox:8088
    timeout: 30
    allowed_tools:
    - execute_python
    - execute_shell
  docker_mcp:
    name: Docker Container Management MCP
    description: Inspect container states, retrieve stdout/stderr logs, and trigger
      safe restarts.
    transport: stdio
    command: python3
    args:
    - "/app/scripts/mcp/docker_mcp.py"
    environment:
      DOCKER_SOCKET: "/var/run/docker.sock"
