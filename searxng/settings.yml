# ──────────────────────────────────────────────
# SearXNG Configuration – Krümel AI Infrastructure
# ──────────────────────────────────────────────
use_default_settings: true

general:
  debug: false
  instance_name: "Krümel Search"

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "change-this-to-any-random-hex-key-in-production"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "de"
  formats:
    - html
    - json
